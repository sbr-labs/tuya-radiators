name: No personal info

# Defence-in-depth: even if the local pre-commit hook is bypassed
# (`git commit --no-verify`), this CI job catches generic PII leaks.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Block obvious PII / AI attribution / secret-shaped strings
        shell: bash
        run: |
          set -eu
          patterns=(
            '[Cc]o-[Aa]uthored-[Bb]y:.*[Cc]laude'
            '[Cc]o-[Aa]uthored-[Bb]y:.*[Aa]nthropic'
            '[Gg]enerated.with.*[Aa]nthropic'
            '[Gg]enerated.with.*[Cc]laude'
            '[a-z0-9._%+-]+@(gmail|live|hotmail|outlook|icloud|yahoo)\.[a-z]{2,}'
            '/Users/[a-z][a-z0-9_-]*/'
            '/home/[a-z][a-z0-9_-]*/'
            '\.tail[a-z0-9]+\.ts\.net'
            # Tuya device_id: 22 chars starting bf + hex/alnum, NOT the placeholder
            'bf[0-9a-f]{20}[a-z]{1,4}'
          )
          violations=0
          for p in "${patterns[@]}"; do
            # grep returns 0 if matches, 1 if no matches, >1 on error
            matches=$(grep -rE --exclude-dir='.git' --exclude-dir='.github' "$p" . 2>/dev/null | grep -v 'bfxxxxxxxxxxxxxxxxxxxx' || true)
            if [ -n "$matches" ]; then
              echo "::error::PII pattern matched: $p"
              echo "$matches" | head -3
              violations=$((violations + 1))
            fi
          done
          if [ "$violations" -gt 0 ]; then
            echo "$violations PII pattern(s) found. Edit the offending file(s) before merging."
            exit 1
          fi
          echo "PII scan clean."
